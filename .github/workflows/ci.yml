# Action SHAs and org reusable-workflow catalog: .lakehouse/pins.json
name: ci

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  guards:
    name: guards
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Wrong remote guard
        run: npm run check:remote
        env:
          ALLOW_TEMPLATE_REMOTE: "1"

      - name: Tier guard
        run: npm run check:tier
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: No self-hosted runners
        run: npm run check:runners

      - name: merge_group triggers on required PR workflows
        run: npm run check:merge-group

      - name: README AUTO freshness
        run: npm run readme:check

      - name: CITATION.cff freshness
        run: npm run citation:check

      - name: Org identity invariants
        run: npm run check:org

      - name: No hardcoded org slug
        run: npm run check:org-slug

      - name: Action pins match .lakehouse/pins.json
        run: npm run check:pins

      - name: Release files present
        run: npm run release:validate

      - name: Discoverability (README + GitHub description/topics)
        run: npm run check:discoverability
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Strict on main only — PRs warn until Sen applies description/topics in the UI.
          DISCOVERABILITY_STRICT: ${{ github.ref == 'refs/heads/main' }}

      - name: Widget contract (widget.json schema + host range)
        run: npm run check:widget

      - name: Design contract range + default contrast
        run: npm run check:design-contract

      - name: No hardcoded design values in widget UI
        run: npm run check:hardcoded-values
        env:
          LAKEHOUSE_HOST_VERSION: "0.1.0"

      - name: Build widget bundle
        run: npm run build

      - name: Widget contract tests
        run: npm test

      - name: Changelog policy
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        run: npm run check:changelog -- --strict

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Install gitleaks CLI
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          set -euo pipefail
          curl -sSL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Full-history scan
        run: npm run check:gitleaks

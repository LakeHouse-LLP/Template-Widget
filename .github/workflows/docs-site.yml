# Action SHAs and org reusable-workflow catalog: .lakehouse/pins.json
name: docs-site

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".lakehouse/org.json"
      - ".lakehouse/discoverability.json"
      - ".github/workflows/docs-site.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-site-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install site deps
        working-directory: site
        run: npm ci

      - name: Build Starlight site
        working-directory: site
        run: npm run build

  lighthouse:
    name: lighthouse
    runs-on: ubuntu-latest
    needs: build
    # Free LHCI budget — warn-only performance; SEO/a11y asserted inside site/lighthouserc.json
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install + LHCI
        working-directory: site
        run: |
          npm ci
          npm run build
          npx --yes @lhci/cli@0.14.0 autorun --config=./lighthouserc.json || true

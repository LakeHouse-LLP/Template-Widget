# Action SHAs and org reusable-workflow catalog: .lakehouse/pins.json
name: changeset-version

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: changeset-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    name: version-pr
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install
        run: npm ci

      - name: Validate release files and pins (PR / merge queue)
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        run: |
          npm run release:validate
          npm run check:pins

      - name: Require changesets when packages change (PR / merge queue)
        # Dependabot only touches lockfile/manifests; no release changeset expected.
        # Prefer PR author so rebases by humans/agents still skip.
        if: >
          (github.event_name == 'pull_request' || github.event_name == 'merge_group')
          && github.actor != 'dependabot[bot]'
          && github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          BASE_REF: ${{ github.base_ref || github.event.merge_group.base_ref }}
        run: |
          # Stacked PRs are not based on main — compare against the PR / merge-group base.
          # merge_group.base_ref is refs/heads/main — strip refs/heads/ when present.
          BASE_REF="${BASE_REF#refs/heads/}"
          git fetch origin "$BASE_REF" --depth=50
          npx changeset status --since="origin/$BASE_REF"

      - name: Create Version PR or CI tag
        if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: npm run changeset:version
          publish-script: npm run changeset:tag
          create-github-releases: false
          push-git-tags: false
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Widget frame</title>
    <style>
      html,
      body,
      #widget-root {
        margin: 0;
        height: 100%;
        background: var(--color-surface-canvas);
      }
    </style>
  </head>
  <body>
    <div id="widget-root"></div>
    <script type="module">
      import {
        applyTheme,
        DEFAULT_THEME_ID,
        getTheme,
      } from "../stubs/design-contract/index.js";
      import widget from "../dist/widget.js";

      const params = new URLSearchParams(location.search);
      let themeId = params.get("theme") || DEFAULT_THEME_ID;
      applyTheme(document, getTheme(themeId));

      const root = document.getElementById("widget-root");
      const bridge = {
        postMessage(type, payload) {
          parent.postMessage({ source: "lakehouse-widget", type, payload }, "*");
        },
        onMessage(type, handler) {
          const fn = (event) => {
            const data = event.data;
            if (!data || data.source !== "lakehouse-host" || data.type !== type) return;
            handler(data.payload);
          };
          window.addEventListener("message", fn);
          return () => window.removeEventListener("message", fn);
        },
        getSettings() {
          return { title: "Hello Widget (preview)", themeId };
        },
        reportReady() {
          this.postMessage("widget.ready", { ok: true });
        },
      };

      widget.mount({ root, bridge, inputs: { greeting: "Hello" } });

      window.addEventListener("message", (event) => {
        const data = event.data;
        if (!data || data.source !== "lakehouse-host" || data.type !== "host.theme") return;
        themeId = data.payload?.themeId || DEFAULT_THEME_ID;
      });
    </script>
  </body>
</html>

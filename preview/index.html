<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LakeHouse Widget Preview (mock host)</title>
    <style>
      :root {
        font-family: var(--font-family-ui);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background:
          linear-gradient(160deg, var(--color-surface-panel), var(--color-surface-canvas) 55%),
          var(--color-surface-canvas);
        color: var(--color-text-primary);
      }
      header {
        padding: var(--space-lg) var(--space-xl);
        border-bottom: var(--size-hairline) solid var(--color-border-default);
        display: flex;
        flex-wrap: wrap;
        gap: var(--space-md);
        align-items: flex-end;
        justify-content: space-between;
      }
      header h1 {
        margin: 0;
        font-size: var(--font-size-body);
        letter-spacing: var(--font-letter-spacing-label);
        text-transform: uppercase;
      }
      header p {
        margin: var(--space-2xs) 0 0;
        color: var(--color-text-muted);
        font-size: var(--font-size-small);
      }
      label {
        display: grid;
        gap: var(--space-2xs);
        font-size: var(--font-size-caption);
        color: var(--color-text-muted);
        letter-spacing: var(--font-letter-spacing-caps);
        text-transform: uppercase;
      }
      select {
        font: inherit;
        color: var(--color-text-primary);
        background: var(--color-surface-panel);
        border: var(--size-hairline) solid var(--color-border-default);
        border-radius: var(--radius-control);
        padding: var(--space-xs) var(--space-sm);
      }
      main {
        display: grid;
        grid-template-columns: 1fr var(--size-preview-aside);
        gap: var(--space-lg);
        padding: var(--space-lg);
        min-height: var(--size-preview-main-min);
      }
      iframe {
        width: 100%;
        min-height: var(--size-shell-widget-min);
        border: var(--size-hairline) solid var(--color-border-default);
        background: var(--color-surface-canvas);
      }
      aside {
        border: var(--size-hairline) solid var(--color-border-default);
        padding: var(--space-md);
        font-size: var(--font-size-small);
        color: var(--color-text-muted);
      }
      aside h2 {
        margin: 0 0 var(--space-sm);
        color: var(--color-accent);
        font-size: var(--font-size-caption);
        letter-spacing: var(--font-letter-spacing-caps);
        text-transform: uppercase;
      }
      #log {
        white-space: pre-wrap;
        font-family: var(--font-family-ui);
        font-size: var(--font-size-caption);
        max-height: var(--size-preview-log-max);
        overflow: auto;
      }
      @media (max-width: 50rem) {
        main {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div>
        <h1>Mock LakeHouse host</h1>
        <p>
          Local preview harness — iframe sandbox + postMessage bridge. Switch skins via the design contract.
        </p>
      </div>
      <label>
        Theme / skin
        <select id="theme-select" aria-label="Theme or skin">
          <option value="lakehouse-studio">LakeHouse Studio (default)</option>
          <option value="lake-morning">Lake Morning (example skin)</option>
        </select>
      </label>
    </header>
    <main>
      <iframe id="widget-frame" title="Widget sandbox" sandbox="allow-scripts allow-same-origin"></iframe>
      <aside>
        <h2>Host log</h2>
        <div id="log">Waiting for widget…</div>
      </aside>
    </main>
    <script type="module" src="./mock-host.js"></script>
  </body>
</html>

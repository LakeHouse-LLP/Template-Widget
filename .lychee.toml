verbose = "info"
no_progress = true
# Mail checking is opt-in in lychee >= 0.18; keep it off for docs.
include_mail = false
accept = ["200", "204", "206", "429"]
max_retries = 2
timeout = 20
exclude = [
  '^file://',
  '^http://localhost',
  '^https://localhost',
  '^https://api\\.scorecard\\.dev/',
  # Marketing site is flaky under CI; docs link to the GitHub repo instead.
  '^https://www\\.up-for-grabs\\.net/?',
]
